name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest  # Usa la imagen más reciente de Ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Versión actualizada

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: '8.2'  # PHP 8.2
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Node.js 18.x (compatible con React 19.0.0)
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps  # Ignora conflictos de React 19.0.0

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/pest
