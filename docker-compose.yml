version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: almacen_tienda_mysql
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistalmacen}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    working_dir: /app
    volumes:
      - ./:/var/www/html
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - dbdata:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: almacen_tienda_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DEFAULT_DB: ${DB_DATABASE:-sistalmacen}
    depends_on:
      - mysql

volumes:
  dbdata:
    driver: local