name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v3  # Actualizado a v3
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Actualizado a v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-scripts --no-progress
          npm install --legacy-peer-deps  # Para evitar conflictos con React 19.0.0

      - name: Run PHP Linter
        run: vendor/bin/pint

      - name: Run Frontend Linter
        run: npm run lint
